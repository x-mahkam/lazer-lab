<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lazer fizikasi — virtual laboratoriya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;650&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#16222E; --muted:#5B6B7A; --line:#D5DCE3;
  --accent:#0F6E7C; --accent-ink:#FFFFFF; --soft:#E3F1F3; --bench:#0D141A; --bench-ink:#C9D6E0;
  --warn:#B42318; --ok:#1B7F4B; --lcd:#0B1F17; --lcd-ink:#7CF0B0;
  --ui:"Commissioner","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10171E; --panel:#182129; --ink:#E6EDF3; --muted:#9AA9B7; --line:#2A3641;
  --accent:#3FB6C6; --accent-ink:#06262B; --soft:#15323A; --warn:#FF8A7A; --ok:#5FD39A; }}
:root[data-theme="dark"]{
  --bg:#10171E; --panel:#182129; --ink:#E6EDF3; --muted:#9AA9B7; --line:#2A3641;
  --accent:#3FB6C6; --accent-ink:#06262B; --soft:#15323A; --warn:#FF8A7A; --ok:#5FD39A; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:650;font-size:1.15rem;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;letter-spacing:0}
.top label{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.top input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;width:11rem}
.top input[type=number]{width:4.5rem}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:80vh}
nav{border-right:1px solid var(--line);padding:16px 10px;background:var(--panel)}
nav button{display:grid;grid-template-columns:2rem 1fr;gap:4px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;line-height:1.3;font-size:.93rem}
nav button b{font-family:var(--mono);font-weight:500;color:var(--muted)}
nav button:hover{background:var(--bg)}
nav button[aria-current=true]{background:var(--soft);color:var(--ink)}
nav button[aria-current=true] b{color:var(--accent)}
nav button span small{display:block;color:var(--muted);font-size:.76rem}
main{min-width:0;padding:22px clamp(14px,3vw,36px) 60px;max-width:1180px}
h1{font-size:clamp(1.35rem,2.4vw,1.8rem);line-height:1.2;margin:0 0 6px;font-weight:650;letter-spacing:-.015em}
.goal{color:var(--muted);max-width:70ch;margin:0 0 18px}
h2{font-size:1.02rem;margin:26px 0 10px;font-weight:650}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rig{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.bench{background:var(--bench);border-radius:12px;padding:10px;color:var(--bench-ink);min-width:0}
.bench canvas{display:block;width:100%;border-radius:6px;touch-action:none}
.card canvas{display:block;width:100%}
.bench .cap,.card .cap{font-size:.78rem;color:#8ea2b3;margin:6px 4px 2px}
.side{display:grid;gap:10px}
.lcd{min-width:0;overflow:hidden;background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:10px 14px;font-family:var(--mono)}
.lcd .k{font-family:var(--ui);font-size:.74rem;color:#8fb8a3;display:block}
.lcd .v{font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lcd .u{font-size:.85rem;color:#8fb8a3;margin-left:6px}
.lcd.off .v{opacity:.25}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ctl{display:grid;gap:4px;margin:0 0 12px}
.ctl:last-child{margin-bottom:0}
.ctl .row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.ctl .row output{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ctl .in{display:flex;gap:6px;align-items:center}
.ctl .nud{flex-wrap:wrap}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ctl select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;width:100%}
.nb{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-width:1.9rem;height:2rem;cursor:pointer;font-family:var(--mono);font-size:.74rem;padding:0 5px;white-space:nowrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{border-color:var(--warn);background:none;color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:0 0 8px}
.chk input{accent-color:var(--accent);width:1.05rem;height:1.05rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:0 22px}
.cols>*{min-width:0}
ol.steps{margin:0;padding-left:1.35rem;max-width:78ch}
ol.steps li{margin:0 0 6px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:14px 0 0}
details summary{cursor:pointer;font-weight:500}
details p,details li{max-width:78ch}
.f{font-family:var(--mono);background:var(--bg);border-radius:6px;padding:2px 7px;font-size:.9em;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table.j{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
table.j th{font-weight:500;text-align:right;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.j td{text-align:right;border-bottom:1px solid var(--line);padding:4px 8px;font-family:var(--mono);white-space:nowrap}
table.j td input{width:6.2rem;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:3px 6px;text-align:right;font-family:var(--mono)}
table.j td button{border:0;background:none;color:var(--muted);cursor:pointer}
.empty{color:var(--muted);font-size:.9rem;padding:10px 2px}
.verify{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.verify label{min-width:min(15rem,100%);font-size:.9rem}
.verify input{width:7.5rem;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-family:var(--mono)}
.verify .res{font-size:.88rem}
.res.ok{color:var(--ok)} .res.bad{color:var(--warn)}
.note{border-left:3px solid var(--warn);background:var(--panel);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.9rem;margin:12px 0;max-width:78ch}
.pass{font-size:.85rem;color:var(--muted);margin:0}
.pass b{color:var(--ink);font-weight:500}
.quiz fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:10px 14px;background:var(--panel)}
.quiz legend{font-weight:500;padding:0 6px}
.quiz label{display:block;padding:3px 0;font-size:.93rem}
.quiz .right{color:var(--ok)} .quiz .wrong{color:var(--warn)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
  nav button{width:auto;white-space:nowrap;grid-template-columns:auto auto}
  nav button span small{display:none}
  .rig{grid-template-columns:1fr}
  .side{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .lcd .v{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Lazer fizikasi — virtual laboratoriya<small>UrDU “Fizika” kafedrasi, PHY 403 fani bo‘yicha 9 ta laboratoriya ishi</small></div>
  <label>Talaba <input id="who" placeholder="Familiya, ism, guruh" autocomplete="off"></label>
  <label>Variant № <input id="variant" type="number" min="1" max="30" value="1"></label>
</header>
<div class="shell">
  <nav id="nav" aria-label="Laboratoriya ishlari"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
const C=299792458, H=6.62607e-34, QE=1.602177e-19;

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const noisy=(x,rel,abs=0)=>x*(1+rel*gauss())+abs*gauss();
const fmt=(x,d=2)=>Number.isFinite(x)?x.toFixed(d).replace('.',','):'—';
function nm2rgb(w,a=1){let r=0,g=0,b=0;
  if(w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}
  else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else{r=1}
  let f=1;if(w<420)f=.35+.65*(w-380)/40;else if(w>700)f=.35+.65*(780-w)/80;

/* ---------- boshqaruv elementlari ---------- */
function slider(o){const dec=o.dec??(String(o.step).split('.')[1]||'').length;
  const out=el('output',null,''),inp=el('input',{type:'range',min:o.min,max:o.max,step:o.step,value:o.value,'aria-label':o.label});
  const show=()=>out.textContent=fmt(+inp.value,dec)+(o.unit?' '+o.unit:'');

  inp.addEventListener('input',fire);
  const nudge=(k)=>el('button',{class:'nb',type:'button',title:(k>0?'+':'−')+fmt(Math.abs(k),dec),onclick:()=>{inp.value=Math.min(o.max,Math.max(o.min,+inp.value+k));fire()}},(k>0?'+':'−')+(o.nudgeLabel?o.nudgeLabel(Math.abs(k)):''));

      el('div',{class:'in nud'},steps.slice().reverse().map(s=>nudge(-s)),el('span',{style:'flex:1'}),steps.map(s=>nudge(s))))
    :el('div',{class:'ctl'},el('div',{class:'row'},el('span',null,o.label),out),el('div',{class:'in'},nudge(-steps[0]),inp,nudge(steps[0])));

function select(o){const s=el('select',{'aria-label':o.label,onchange:()=>o.onchange&&o.onchange(s.value)},o.options.map(([v,t])=>el('option',{value:v},t)));
  if(o.value!=null)s.value=o.value;return{root:el('div',{class:'ctl'},el('div',{class:'row'},el('span',null,o.label)),s),get:()=>s.value,set:v=>s.value=v}}
function check(label,val,onchange){const i=el('input',{type:'checkbox',onchange:()=>onchange&&onchange(i.checked)});i.checked=!!val;
  return{root:el('label',{class:'chk'},i,label),get:()=>i.checked,set:v=>i.checked=v}}
const button=(t,fn,kind='')=>el('button',{class:'btn '+kind,type:'button',onclick:fn},t);
function lcd(label,unit){const v=el('span',{class:'v'},'—'),root=el('div',{class:'lcd'},el('span',{class:'k'},label),v,el('span',{class:'u'},unit||''));
  return{root,set:(x,d=2)=>{v.textContent=typeof x==='string'?x:fmt(x,d)},off:b=>root.classList.toggle('off',b),unit:u=>root.lastChild.textContent=u}}
/* ---------- o‘lchash jurnali ---------- */
function journal(cols,opt={}){const rows=[];const body=el('tbody'),empty=el('div',{class:'empty'},opt.empty||'Jurnal bo‘sh. O‘lchash natijasini yozish uchun “Jadvalga yozish” tugmasini bosing.');

      return el('td',null,typeof r[j]==='number'?fmt(r[j],c.d??3):String(r[j]??''))}),
      el('td',null,el('button',{title:'Satrni o‘chirish',onclick:()=>{rows.splice(i,1);render();api.onchange&&api.onchange()}},'✕'))))});
    empty.hidden=rows.length>0;tbl.hidden=rows.length===0}
  api.add=r=>{rows.push(r);render();api.onchange&&api.onchange()};
  api.clear=()=>{rows.length=0;render();api.onchange&&api.onchange()};
  api.num=(i,j)=>{const v=rows[i][j];return typeof v==='number'?v:parseFloat(String(v).replace(',','.'))};
  const csv=()=>[cols.map(c=>c.h).join('\t'),...rows.map(r=>r.map(v=>typeof v==='number'?String(v).replace('.',','):v??'').join('\t'))].join('\n');
  const msg=el('span',{class:'res'});
  const copy=button('Jadvaldan nusxa olish (Excel uchun)',async()=>{const t=csv();let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
    if(!ok){const ta=el('textarea',{style:'width:100%;height:120px;margin-top:8px;font:12px var(--mono)'});ta.value=t;api.root.append(ta);ta.select()}
    msg.textContent=ok?'Nusxa olindi — Excelga qo‘ying (Ctrl+V).':'Matnni belgilab, Ctrl+C bilan nusxa oling.'},'ghost');
  api.root=el('div',null,el('div',{class:'scroll'},tbl),empty,el('div',{class:'btns'},copy,button('Jurnalni tozalash',()=>api.clear(),'ghost'),msg));
  render();return api}
/* ---------- natijani tekshirish ---------- */
function verify(items){return el('div',{class:'card'},items.map(it=>{const inp=el('input',{inputmode:'decimal',placeholder:it.unit,'aria-label':it.label}),res=el('span',{class:'res'});
    const go=()=>{const x=parseFloat(inp.value.replace(',','.'));if(!Number.isFinite(x)){res.className='res bad';res.textContent='Son kiriting.';return}
      const t=it.truth(),err=it.abs!=null?Math.abs(x-t):Math.abs(x-t)/Math.abs(t),ok=err<=(it.abs??it.tol);
      res.className='res '+(ok?'ok':'bad');
      res.textContent=ok?`To‘g‘ri: farq ${it.abs!=null?fmt(err,3)+' '+it.unit:fmt(err*100,1)+' %'} — ruxsat etilgan chegarada.`:`Farq katta (${it.abs!=null?fmt(err,3)+' '+it.unit:fmt(err*100,1)+' %'}). O‘lchash va hisoblarni, ayniqsa birliklarni qayta tekshiring.`};
    return el('div',{class:'verify'},el('label',null,it.label),inp,button('Tekshirish',go,'ghost'),res)}))}
/* ---------- canvas yordamchilari ---------- */
function fit(cv,h){const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(280,cv.clientWidth||cv.parentNode.clientWidth||600);

function niceTicks(a,b,n=5){if(a===b){a-=1;b+=1}const s=(b-a)/n,p=Math.pow(10,Math.floor(Math.log10(s))),m=[1,2,5,10].find(k=>k*p>=s)*p;const t=[];for(let v=Math.ceil(a/m)*m;v<=b+1e-9;v+=m)t.push(+v.toFixed(10));return t}
/* grafik: series=[{pts:[[x,y]],color,line,dots}], hover=true bo‘lsa kursor koordinatasi ko‘rsatiladi */

  g.textAlign='right';niceTicks(y0,y1,5).forEach(t=>{g.beginPath();g.moveTo(L,Y(t));g.lineTo(w-R,Y(t));g.stroke();g.fillText(String(t).replace('.',','),L-6,Y(t)+4)});
  g.fillStyle=ink;g.textAlign='center';g.fillText(o.xlabel||'',(L+w-R)/2,h-8);g.save();g.translate(13,(T+h-B)/2);g.rotate(-Math.PI/2);g.fillText(o.ylabel||'',0,0);g.restore();

LABS.push({id:6,short:'Interferension usul',kind:'Yung tajribasi, panjara',title:'Lazer nurlanishining to‘lqin uzunligini interferension usul yordamida aniqlash',

build(main){const lamLD=Math.round(V(6,'ld',636,672)),gU=Math.round(V(6,'gr',120,420)/10)*10;let mx=null;

  function inten(xmm,lam){const e=elem.get(),x=xmm*1e-3,l=L.get();if(e[0]==='y'){const d=+e.slice(1)*1e-3,b=.04e-3,s=x/Math.hypot(x,l),u=Math.PI*b*s/lam,v=Math.PI*d*s/lam;return(u?Math.sin(u)/u:1)**2*Math.cos(v)**2}
    const d=1e-3/+e.slice(1);let I=0;const sig=Math.max(.9,+zoom.get()/260);for(let m=-Math.floor(d/lam);m<=Math.floor(d/lam);m++){const s=m*lam/d;if(Math.abs(s)>=1)continue;const xm=l*s/Math.sqrt(1-s*s)*1e3;I+=Math.exp(-(((xmm-xm)/sig)**2))/(1+.55*m*m)}return Math.min(1,I)}

    g.strokeStyle=nm2rgb(lam*1e9,1);g.lineWidth=1.4;g.beginPath();for(let px=x0;px<x1;px++){const xm=-Z+(px-x0)/(x1-x0)*2*Z,y=250-inten(xm,lam)*100;px===x0?g.moveTo(px,y):g.lineTo(px,y)}g.stroke();gLabel(g,'intensivlik taqsimoti',x0,146,'left');
    g.fillStyle='#d8e2ea';g.fillRect(x0,262,x1-x0,1);const step=Z/10;for(let k=-10;k<=10;k++){const xx=X(k*step);g.fillRect(xx,262,1,k%5?5:10);if(k%5===0)gLabel(g,String(k*step),xx,288)}gLabel(g,'x, mm',x1,146,'right');
    if(mx!=null){g.strokeStyle='rgba(255,255,255,.7)';g.setLineDash([4,4]);g.beginPath();g.moveTo(X(mx),16);g.lineTo(X(mx),262);g.stroke();g.setLineDash([])}}
  const toX=e=>{const r=cv.getBoundingClientRect(),Z=+zoom.get();let x=-Z+(e.clientX-r.left-16)/(r.width-32)*2*Z;const res=Z/200;return Math.round(x/res)*res};

  main.append(el('div',{class:'rig'},el('div',{class:'bench'},cv,el('div',{class:'cap'},'Yuqorida — ekrandagi manzara, pastda — intensivlik grafigi va millimetrli shkala. Kursor bilan yo‘l markazini ko‘rsating va bosing. Aniqlik ekranning ko‘rinadigan qismiga bog‘liq — mayda yo‘llar uchun kichik oraliqni tanlang.')),el('div',{class:'side'},lx.root,el('div',{class:'card'},src.root,elem.root,L.root,zoom.root))),
    ...section('Bajarish tartibi',steps(['<b>Yung usuli.</b> He–Ne lazeri va d = 0,20 mm li qo‘sh tirqishni tanlang, L = 2 m. Bir-biridan uzoq ikkita minimum (yoki maksimum) koordinatasini yozib, ular orasidagi masofani oraliqlar soni N ga bo‘ling: <span class="f">Δx = l / N</span>.','To‘lqin uzunligini hisoblang: <span class="f">λ = d·Δx / L</span>. O‘lchashni yana ikki xil L va boshqa d uchun takrorlang.','<b>Panjara usuli.</b> 100 shtrix/mm li panjarani tanlang, L = 1 m. m = ±1, ±2, ±3 tartibli maksimumlar koordinatalarini yozing; <span class="f">x_m = (x₊ − x₋)/2</span>.','<span class="f">sin φ = x_m / √(x_m² + L²)</span>, <span class="f">λ = d·sin φ / m</span>, bu yerda d = 1/n₀. Katta burchaklarda sin φ ≈ tg φ taqribidan foydalanmang.','Yarimo‘tkazgichli lazerni tanlab, uning noma’lum to‘lqin uzunligini panjara yordamida aniqlang.','He–Ne lazeri bilan noma’lum panjaraning shtrixlar sonini aniqlang.','Ikki usulning aniqligini taqqoslang: qaysi birida nisbiy xatolik kichik va nima uchun?'])),

    theory('Qisqacha nazariya','<p>Yung tajribasida qo‘shni yo‘llar orasidagi masofa <span class="f">Δx = λL/d</span>. Yo‘llar intensivligi bitta tirqishdagi difraksiya taqsimoti bilan modulyatsiyalangan. Difraksion panjaraning bosh maksimumlari: <span class="f">d·sin φ = mλ</span>; ular tor va yorqin, shuning uchun koordinatalari aniqroq o‘lchanadi.</p>'));

function beamLab(id,cfg){return{id,short:cfg.short,kind:'dasta profili, Θ, w₀',title:cfg.title,goal:cfg.goal,
build(main){const w0=V(id,'w0',cfg.w0[0],cfg.w0[1])*1e-3,M2=V(id,'m2',1.02,1.22),xc0=V(id,'xc',-.6,.6),pt=V(id,'pt',-.06,.06),F=.5;
  let prof=[],scanning=false,showIe=false;
  const line=select({label:'Generatsiya chizig‘i',options:cfg.lines.map(l=>[String(l[0]),`${String(l[0]).replace('.',',')} nm — ${l[1]}`])  ,onchange:()=>{prof=[];draw()}});
  const lam=()=>+line.get()*1e-9,theta=()=>M2*lam()/(Math.PI*w0),zR=()=>w0/theta();
  const z=slider({label:'Detektorgacha masofa z',min:.5,max:12,step:.25,value:2,unit:'m',nudges:[.25],oninput:()=>{prof=[];draw()}});
  const x=slider({label:'Detektor koordinatasi x (mikrometr)',min:-15,max:15,step:.01,value:-15,unit:'mm',nudges:[.01,.1,1],nudgeLabel:k=>String(k).replace('.',','),oninput:draw});
  const lens=check('Fokal dog‘ usuli: f = 500 mm li linza, detektor fokal tekislikda',false,()=>{prof=[];draw()});
  const stp=select({label:'Avtomatik skanerlash qadami',options:[['0.5','0,5 mm'],['0.2','0,2 mm'],['0.05','0,05 mm'],['0.01','0,01 mm']],value:'0.2'});
  const cv=el('canvas'),pc=el('canvas'),dz=el('canvas'),li=lcd('Fototok I','µA'),lz=lcd('z / x','');
  const wz=()=>lens.get()?F*theta():w0*Math.sqrt(1+(z.get()/zR())**2),xc=()=>lens.get()?0:xc0+pt*z.get();
  const ideal=xx=>{const w=wz()*1e3;return 85*(w0*1e3/w)**2*Math.exp(-2*(xx-xc())**2/(w*w))};
  const read=xx=>Math.max(0,noisy(ideal(xx),.006,.002)+.002);
  const J=journal([{h:'Chiziq, nm'},{h:'z, m',d:2},{h:'I_max, µA',d:3},{h:'x_A, mm',edit:true},{h:'x_B, mm',edit:true},{h:'d = x_B − x_A, mm',edit:true}],{empty:'Jurnal bo‘sh. Profilni skanerlang, so‘ng “Skaner natijasini jurnalga qo‘shish”ni bosing va x_A, x_B, d ustunlarini o‘zingiz to‘ldiring.'});
  function draw(){const{g,w,h}=fit(cv,230),nm=+line.get();g.clearRect(0,0,w,h);gRail(g,w,200);gBox(g,18,92,96,40);gLabel(g,cfg.name,66,117,'center','#dfe8ef');
    const xa=114,xb=w-170,zz=lens.get()?6:z.get(),xd=xa+(xb-xa)*zz/12,sc=5,hw=q=>Math.max(1.5,w0*Math.sqrt(1+(q/zR())**2)*1e3*sc);
    g.fillStyle=nm2rgb(nm,.55);g.beginPath();g.moveTo(xa,112-hw(0));for(let q=0;q<=zz;q+=.25)g.lineTo(xa+(xb-xa)*q/12,112-hw(q));for(let q=zz;q>=0;q-=.25)g.lineTo(xa+(xb-xa)*q/12,112+hw(q));g.fill();
    g.fillStyle='#31414e';for(let q=0;q<=12;q+=2){const xx=xa+(xb-xa)*q/12;g.fillRect(xx,200,1,8);gLabel(g,q+' m',xx,222)}
    if(lens.get()){g.strokeStyle='#9fd0ff';g.lineWidth=2;g.beginPath();g.ellipse(xd-46,112,6,30,0,0,7);g.stroke();gLabel(g,'linza',xd-46,160)}
    const yy=112+Math.max(-70,Math.min(70,(x.get()-xc())*sc*(lens.get()?8:1)));gBox(g,xd,yy-7,14,14,'#3a3320','#c9b458');g.strokeStyle='#52677a';g.beginPath();g.moveTo(xd+7,36);g.lineTo(xd+7,190);g.stroke();gLabel(g,'detektor',xd+7,28);
    /* dog‘ning ko‘rinishi */const sx=w-140,sy=40,S=120,ww=wz()*1e3,view=Math.max(2,Math.ceil(ww*2.6));g.fillStyle='#05080a';g.fillRect(sx,sy,S,S);
    const gr=g.createRadialGradient(sx+S/2,sy+S/2,0,sx+S/2,sy+S/2,ww/view*S/2*1.5);gr.addColorStop(0,nm2rgb(nm,1));gr.addColorStop(.45,nm2rgb(nm,.4));gr.addColorStop(1,nm2rgb(nm,0));g.fillStyle=gr;g.fillRect(sx,sy,S,S);
    gLabel(g,`ekrandagi dog‘ (kadr ${view*2}×${view*2} mm)`,sx+S/2,sy+S+16);
    li.set(read(x.get()),3);lz.set(fmt(z.get(),2)+' m / '+fmt(x.get(),2)+' mm');drawProf()}
  function drawProf(){const im=prof.length?Math.max(...prof.map(p=>p[1])):0;
    plot(pc,{series:[{pts:prof,color:nm2rgb(+line.get(),1).replace(/,[^,]+\)$/,',1)'),line:true,r:2}],xlabel:'x, mm',ylabel:'I, µA',ymin:0,empty:'Profil hali o‘lchanmagan. “Profilni avtomatik skanerlash”ni bosing yoki detektorni qo‘lda siljitib, nuqtalarni qo‘shing.',
      hlines:showIe&&im?[{y:im/Math.E**2,label:'I_max / e² = '+fmt(im/Math.E**2,3)+' µA',color:'#1f6fb5'}]:[],hover:(a,b)=>`x = ${fmt(a,3)} mm;  I = ${fmt(b,3)} µA`})}
  function drawDz(){const pts=J.rows.map((r,i)=>[r[1],J.num(i,5)]).filter(p=>Number.isFinite(p[1]));const s=[{pts,color:'#c0182b'}];
    if(pts.length>=3){const f=linfit(pts),xs=pts.map(p=>p[0]);s.push({pts:[[Math.min(...xs),f.k*Math.min(...xs)+f.b],[Math.max(...xs),f.k*Math.max(...xs)+f.b]],color:'#5B6B7A',line:true,dots:false})}
    plot(dz,{series:s,xlabel:'z, m',ylabel:'d, mm',ymin:0,empty:'Jurnaldagi “d” ustunini to‘ldiring — nuqtalar shu yerda paydo bo‘ladi.'})}
  J.onchange=drawDz;
  function scan(){if(scanning)return;scanning=true;prof=[];const st=+stp.get(),ww=wz()*1e3,a=Math.max(-15,xc()-3.2*ww),b=Math.min(15,xc()+3.2*ww);let cur=Math.round(a/st)*st;
    const go=()=>{for(let i=0;i<Math.max(1,Math.round(.06/st*8));i++){if(cur>b){scanning=false;draw();return}x.set(cur);prof.push([+cur.toFixed(3),read(cur)]);cur+=st}draw();raf=requestAnimationFrame(go)};go()}
  main.append(el('p',{class:'pass'},el('b',null,'Stend: '),'uzunligi 12 m li optik yo‘lak; fotodetektor diafragmasi 0,05 mm; mikrometr qadami 0,01 mm. Dasta o‘qi mikrometr noliga aniq to‘g‘ri kelmasligi mumkin — markazni profil maksimumidan toping.'),
    el('div',{class:'rig',style:'margin-top:12px'},el('div',{class:'bench'},cv,el('div',{class:'cap'},'Dastaning ko‘ndalang o‘lchami sxemada kattalashtirib ko‘rsatilgan.')),el('div',{class:'side'},li.root,lz.root)),

      el('div',{class:'btns'},button('Profilni avtomatik skanerlash',scan),button('Joriy nuqtani profilga qo‘shish',()=>{prof.push([x.get(),read(x.get())]);prof.sort((a,b)=>a[0]-b[0]);drawProf()},'ghost'),button('I_max/e² sathini ko‘rsatish',()=>{showIe=!showIe;drawProf()},'ghost'),
        button('Skaner natijasini jurnalga qo‘shish',()=>{if(!prof.length)return;J.add([line.get().replace('.',','),lens.get()?'fokus (f = 0,5 m)':z.get(),Math.max(...prof.map(p=>p[1])),'','',''])}))),
    ...section('Dasta profili I(x)',el('div',{class:'card'},pc)),
    ...section('Bajarish tartibi',steps(cfg.steps)),
    ...section('O‘lchash jurnali',J.root),...section('Grafik d(z)',el('div',{class:'card'},dz)),
    ...section('Natijani tekshirish',verify([{label:`To‘liq divergensiya Θ (${cfg.lines[0][0].toString().replace('.',',')} nm)`,unit:'mrad',truth:()=>2*M2*cfg.lines[0][0]*1e-9/(Math.PI*w0)*1e3,tol:.06},{label:'Bo‘g‘iz radiusi w₀ (d(z) ning z → 0 dagi qiymatidan)',unit:'mm',truth:()=>w0*1e3,tol:.12},{label:'Dasta sifati M² = π·w₀·θ / λ',unit:'',truth:()=>M2,tol:.12}])),
    theory('Qisqacha nazariya',`<p>Gauss dastasining radiusi <span class="f">w(z) = w₀·√(1 + (z/z_R)²)</span>, <span class="f">z_R = π·w₀²/(M²·λ)</span>. Uzoq zonada (z ≫ z_R) dasta konus bo‘ylab yoyiladi; yarim burchak <span class="f">θ = M²·λ/(π·w₀)</span>, to‘liq burchak <span class="f">Θ = 2θ</span>. Dasta diametri <span class="f">d = 2w</span> profilning <span class="f">I_max/e² = 0,135·I_max</span> sathidagi kengligi sifatida aniqlanadi. Ikki kesim usuli: <span class="f">Θ = (d₂ − d₁)/(z₂ − z₁)</span> — faqat uzoq zonada to‘g‘ri. Umumiy holda <span class="f">d² = d₀² + Θ²·z²</span>: d² ning z² ga bog‘lanishi to‘g‘ri chiziq. Fokal dog‘ usuli: <span class="f">Θ = d_f / f</span>.</p>${cfg.extra||''}`));
  draw();drawDz();onResize(()=>{draw();drawDz()})}}}
const commonSteps=n=>[`Generatsiya chizig‘ini tanlang (${n}). z = 1 m da “Profilni avtomatik skanerlash”ni bosing. Tor profil uchun kichik qadam (0,05 yoki 0,01 mm) tanlang.`,'Grafik ustida kursor yordamida <span class="f">I_max</span> ni, so‘ng <span class="f">I_e = 0,135·I_max</span> sathiga mos chap va o‘ng nuqtalar <span class="f">x_A</span>, <span class="f">x_B</span> ni aniqlang (“I_max/e² sathini ko‘rsatish” tugmasi yordam beradi). Natijani jurnalga qo‘shib, x_A, x_B va d ni yozing.','O‘lchashni z = 2, 4, 6, 8, 10, 12 m uchun takrorlang. d(z) grafigi jurnaldagi qiymatlaringizdan avtomatik chiziladi.','Uzoq zonadagi nuqtalar bo‘yicha qiyalikdan <span class="f">Θ = Δd/Δz</span> ni toping (mm/m = mrad). Yaqin zonadagi (z ≲ z_R) nuqtalar to‘g‘ri chiziqdan nima uchun chetlashadi?','d² ning z² ga bog‘lanish grafigini Excelda chizing: qiyalik Θ² ni, ordinata o‘qidagi kesma d₀² = (2w₀)² ni beradi.','<span class="f">θ = Θ/2</span>, <span class="f">z_R = w₀/θ</span> va <span class="f">M² = π·w₀·θ/λ</span> ni hisoblang.','Fokal dog‘ usulini yoqing, fokusdagi profilni 0,01 mm qadam bilan skanerlang va <span class="f">Θ = d_f / f</span> ni oldingi natija bilan taqqoslang.'];
LABS.push(beamLab(7,{short:'He–Ne: divergensiya',name:'He–Ne lazer',title:'Geliy-neon lazer nurining divergensiya burchagini aniqlash',goal:'He–Ne lazeri dastasining profilini turli masofalarda skanerlab, dasta diametri, divergensiya burchagi, bo‘g‘iz radiusi va dasta sifati parametrini aniqlang.',w0:[.30,.45],lines:[[632.8,'qizil']],steps:commonSteps('632,8 nm')}));
LABS.push(beamLab(8,{short:'Argon: divergensiya',name:'Ar⁺ lazer',title:'Argon lazer nurining divergensiya burchagini aniqlash',goal:'Argon ionli lazerining 488,0 va 514,5 nm chiziqlari uchun divergensiya burchagini aniqlang va uning to‘lqin uzunligiga proporsionalligini tekshiring.',w0:[.55,.75],lines:[[488.0,'ko‘k'],[514.5,'yashil'],[457.9,'binafsha-ko‘k']],
